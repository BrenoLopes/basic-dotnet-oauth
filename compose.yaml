name: dotnetauth

services:
  mariadb:
    image: mariadb:11.6
    environment:
      MARIADB_DATABASE: dotnetauth
      MARIADB_USER: dotnetauth
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-dotnetauth_dev_password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_dotnetauth_dev_password}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  rustfs-permissions:
    image: alpine:3.22
    user: root
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - rustfs_data:/data

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-dotnetauthadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-dotnetauth_dev_secret_key}
    command: ["server", "/data"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    ports:
      - "8978:8978"
    volumes:
      - cloudbeaver_workspace:/opt/cloudbeaver/workspace
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
  valkey_data:
  rustfs_data:
  cloudbeaver_workspace:
